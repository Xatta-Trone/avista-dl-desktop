name: Build Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional existing tag to publish the installer to, for example vX.Y.Z"
        required: false
        type: string

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements_base.txt
            requirements_lock.txt

      - name: Verify bundled assets
        shell: pwsh
        run: |
          $assets = @(
            "app/assets/logo.png",
            "app/assets/logo.ico"
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset)) {
              throw "Required packaged asset is missing: $asset"
            }
          }

      - name: Install focused test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -r requirements_base.txt
          python -m pip install matplotlib scipy scikit-learn imbalanced-learn

      - name: Verify release metadata synchronization
        shell: pwsh
        run: |
          $releaseCheckArgs = @(
            "scripts/prepare_release.py",
            "--check"
          )
          $expectedTag = ""
          if ("${{ github.ref_type }}" -eq "tag") {
            $expectedTag = "${{ github.ref_name }}"
          } elseif ("${{ inputs.release_tag }}") {
            $expectedTag = "${{ inputs.release_tag }}"
          }
          if ($expectedTag) {
            $releaseCheckArgs += @("--expected-tag", $expectedTag)
          }
          python @releaseCheckArgs

      - name: Run packaging and resource tests
        shell: pwsh
        run: |
          python -m pytest `
            tests/test_resources.py `
            tests/test_main.py `
            tests/test_packaging.py `
            tests/test_version_metadata.py `
            -q

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build AVISTA standalone and installer
        shell: pwsh
        run: |
          ./packaging/build_pyinstaller.ps1 `
            -Configuration Release `
            -PythonExecutable python `
            -Clean

      - name: Verify installer output
        shell: pwsh
        run: |
          $requiredArtifacts = @(
            "installer/AVISTA_Setup.exe",
            "release/AVISTA/AVISTA.exe",
            "release/AVISTA/AVISTADeepWorker.exe",
            "release/AVISTA/_internal/xgboost/VERSION",
            "release/AVISTA/_internal/xgboost/lib/xgboost.dll"
          )
          foreach ($artifact in $requiredArtifacts) {
            if (-not (Test-Path -LiteralPath $artifact)) {
              throw "Required release artifact was not created: $artifact"
            }
          }
          $forbiddenCheckpoints = @(
            Get-ChildItem -LiteralPath "release/AVISTA" -Recurse -File `
              -Filter "tabpfn-v2.5-classifier-v2.5_default.ckpt"
          )
          if ($forbiddenCheckpoints.Count -gt 0) {
            throw "Forbidden TabPFN checkpoint was packaged: $($forbiddenCheckpoints.FullName -join ', ')"
          }
          python scripts/audit_packaged_release.py `
            --dist-dir release/AVISTA `
            --skip-model-smokes

      - name: Calculate installer SHA256 and update metadata
        id: installer_hash
        shell: pwsh
        run: |
          $installerPath = "installer/AVISTA_Setup.exe"
          if (-not (Test-Path -LiteralPath $installerPath)) {
            throw "installer/AVISTA_Setup.exe was not created."
          }
          $hash = (
            Get-FileHash `
              -LiteralPath $installerPath `
              -Algorithm SHA256
          ).Hash.ToLowerInvariant()
          if ($hash -notmatch '^[0-9a-f]{64}$') {
            throw "Invalid SHA256 generated for AVISTA_Setup.exe."
          }
          Write-Host "AVISTA_Setup.exe SHA256: $hash"
          "sha256=$hash" >> $env:GITHUB_OUTPUT

          $expectedTag = ""
          if ("${{ github.ref_type }}" -eq "tag") {
            $expectedTag = "${{ github.ref_name }}"
          } elseif ("${{ inputs.release_tag }}") {
            $expectedTag = "${{ inputs.release_tag }}"
          }
          $metadataArgs = @(
            "scripts/prepare_release.py",
            "--installer", $installerPath,
            "--sha256", $hash
          )
          if ($expectedTag) {
            $metadataArgs += @("--expected-tag", $expectedTag)
          }
          python @metadataArgs

      - name: Verify installer SHA256 metadata
        shell: pwsh
        run: |
          $expectedTag = ""
          if ("${{ github.ref_type }}" -eq "tag") {
            $expectedTag = "${{ github.ref_name }}"
          } elseif ("${{ inputs.release_tag }}") {
            $expectedTag = "${{ inputs.release_tag }}"
          }
          $verifyArgs = @(
            "scripts/prepare_release.py",
            "--verify-installer", "installer/AVISTA_Setup.exe"
          )
          if ($expectedTag) {
            $verifyArgs += @("--expected-tag", $expectedTag)
          }
          python @verifyArgs

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: AVISTA_Setup
          path: installer/AVISTA_Setup.exe
          if-no-files-found: error
          archive: false

      - name: Resolve release tag
        id: release_tag
        shell: pwsh
        run: |
          $tag = ""
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}".StartsWith("v")) {
            $tag = "${{ github.ref_name }}"
          }
          elseif ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.release_tag }}"
          }

          if ([string]::IsNullOrWhiteSpace($tag)) {
            "publish=false" >> $env:GITHUB_OUTPUT
            "tag=" >> $env:GITHUB_OUTPUT
            Write-Host "No release tag resolved. Installer remains available as a workflow artifact."
          }
          elseif (-not $tag.StartsWith("v")) {
            throw "Release tags must start with 'v'. Received: $tag"
          }
          else {
            "publish=true" >> $env:GITHUB_OUTPUT
            "tag=$tag" >> $env:GITHUB_OUTPUT
            Write-Host "Resolved release tag: $tag"
          }

      - name: Publish installer to GitHub Release
        if: steps.release_tag.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          if (-not (Test-Path -LiteralPath "installer/AVISTA_Setup.exe")) {
            throw "installer/AVISTA_Setup.exe was not created."
          }

          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG `
              --title $env:RELEASE_TAG `
              --generate-notes
            if ($LASTEXITCODE -ne 0) {
              throw "Could not create GitHub Release for $env:RELEASE_TAG."
            }
          }

          gh release upload $env:RELEASE_TAG `
            installer/AVISTA_Setup.exe `
            --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "Could not upload AVISTA_Setup.exe to GitHub Release $env:RELEASE_TAG."
          }

      - name: Publish update metadata to default branch
        if: steps.release_tag.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          $repository = "${{ github.repository }}"
          $repoInfo = gh api "repos/$repository" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) {
            throw "Could not read repository metadata."
          }
          $defaultBranch = $repoInfo.default_branch
          $fileInfo = gh api `
            "repos/$repository/contents/updates.json?ref=$defaultBranch" |
            ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) {
            throw "Could not read updates.json from $defaultBranch."
          }

          $remoteText = [Text.Encoding]::UTF8.GetString(
            [Convert]::FromBase64String(($fileInfo.content -replace '\s', ''))
          )
          $remoteMetadata = $remoteText | ConvertFrom-Json
          $generatedMetadata = Get-Content -LiteralPath "updates.json" -Raw |
            ConvertFrom-Json
          if ($remoteMetadata.latest_version -ne $generatedMetadata.latest_version) {
            throw "Default-branch updates.json version does not match the release."
          }
          if ($remoteMetadata.installer_url -ne $generatedMetadata.installer_url) {
            throw "Default-branch updates.json installer URL does not match the release."
          }
          $remoteMetadata.sha256 = $generatedMetadata.sha256
          $updatedText = ($remoteMetadata | ConvertTo-Json -Depth 20) + "`n"
          $encoded = [Convert]::ToBase64String(
            [Text.Encoding]::UTF8.GetBytes($updatedText)
          )
          $payload = @{
            message = "chore(release): update installer checksum for $env:RELEASE_TAG"
            content = $encoded
            sha = $fileInfo.sha
            branch = $defaultBranch
          } | ConvertTo-Json -Depth 5
          $payloadPath = Join-Path $env:RUNNER_TEMP "updates-payload.json"
          Set-Content -LiteralPath $payloadPath -Value $payload -Encoding utf8
          gh api `
            --method PUT `
            "repos/$repository/contents/updates.json" `
            --input $payloadPath
          if ($LASTEXITCODE -ne 0) {
            throw "Could not publish updates.json to $defaultBranch."
          }
